      pdf_omitted_body: "The EH Archiver reply at %{reply_url} for %{gallery_url} contains the metadata and converted images, but not the generated PDF. The PDF is %{pdf_size}, exceeding this site's %{limit} maximum attachment size."
      operational_failure_title: "EH Archiver operational failure"
      delivery_failure_title: "EH Archiver could not publish an artifact"
      operational_failure_body: |
        EH Archiver requires administrator attention.

        - Task: `%{task_id}`
        - Gallery: %{gallery_url}
        - Source request: %{source_url}
        - Error code: `%{error_code}`
