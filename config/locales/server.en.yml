en:
  eharchiver:
    dashboard:
      errors:
        plugin_disabled: "EH Archiver is disabled."
        not_retryable: "Only failed tasks can be retried."
        requester_not_authorized: "The original requester is no longer authorized to run this task."
        active_retry: "This task already has an active retry."
        retry_failed: "The retry task could not be created."
    notifications:
      not_available: "not available"
      permission_denied_title: "EH Archiver request not permitted"
      permission_denied_body: "Your EH Archiver request at %{topic_url} could not be started because your account or that topic does not have the required permission."
