    eharchiver_default_archive_quality: "默认请求的归档质量。默认值为原始版本时，没有原始版权限的用户会自动改用重采样版本。"
    eharchiver_allowed_categories: "允许创建归档任务的分类。留空表示所有分类，但仍受用户组权限限制。"
    eharchiver_request_allowed_groups: "允许请求归档任务的用户组。"
